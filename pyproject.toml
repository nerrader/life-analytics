[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/life_analytics/__init__.py"

[project]
name = "life-analytics"
dynamic = ["version"]
description = "A tracker to analyze my life"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    {"name" = "nerrader", email = "nerrader@proton.me"}
] 
dependencies = [
    "platformdirs>=4.11.0",
    "questionary>=2.1.1",
    "rich>=15.0.0",
    "typer>=0.27.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "ruff>=0.16.0",
]
