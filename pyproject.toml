[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "life-analytics"
dynamic = ["version"]
description = "A tracker to analyze my life"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "mypy>=2.3.0",
    "questionary>=2.1.1",
    "rich>=15.0.0",
    "typer>=0.27.0",
]
